# Ambiente experimental — mesma infraestrutura para Rules e LLM (RNF-001).
# Imagens e versões são provisórias; o pin reproduzível é feito em M8-T03.
name: rule2llm-orch-lab

services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management (UI e API HTTP)
    volumes:
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  # orders-service — API HTTP. Compartilha orders.db (volume orders-data) com o
  # worker do mesmo serviço; nenhum outro serviço acessa esse volume.
  orders-api:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    command: ["uvicorn", "--factory", "services.orders.app.main:create_app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &orders-env
      BROKER_URL: amqp://tcc:tcc@rabbitmq:5672//
      ORDERS_DB_PATH: /data/orders.db
      EXECUTION_ID: ${EXECUTION_ID:-PILOT_0000}
      # Config efetiva da execução (gravada por new_execution) ou a base.
      EXPERIMENT_CONFIG_PATH: ${EXECUTION_CONFIG_PATH:-/srv/config/experiment_config.yml}
      DATA_ROOT: /srv/data
      SERVICE_ROLE: orders-api
      # D-08: Ollama no host (bare-metal, GPU Metal), fora do compose.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - orders-data:/data
      - ./config:/srv/config:ro
      - ./data:/srv/data       # artefatos: data/<pilot|experiment>/<EXECUTION_ID>/
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # orders-service — worker Celery que consome orders.events. Mesmo serviço e mesma
  # imagem da API; compartilha o volume orders-data.
  orders-worker:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    command:
      - celery
      - --app=services.orders.app.messaging.celery_app
      - worker
      - --queues=orders.events
      - --concurrency=1
      - --without-mingle
      - --without-gossip
      - --without-heartbeat
      - --loglevel=INFO
    environment:
      <<: *orders-env
      SERVICE_ROLE: orders-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - orders-data:/data
      - ./config:/srv/config:ro
      - ./data:/srv/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  # inventory-service — workers de reserva. Banco próprio (volume inventory-data).
  # Um processo por rota lógica do mesmo serviço (D-21): inventory.primary e
  # inventory.fallback. Parar o container derruba o serviço inteiro.
  inventory-worker:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    command: ["python", "-m", "services.inventory.app.run_workers"]
    # Parada limpa (warm shutdown dos dois workers) no cenário de indisponibilidade;
    # o padrão observado neste ambiente (1 s) matava o container com SIGKILL.
    stop_grace_period: 30s
    environment:
      BROKER_URL: amqp://tcc:tcc@rabbitmq:5672//
      INVENTORY_DB_PATH: /data/inventory.db
      EXECUTION_ID: ${EXECUTION_ID:-PILOT_0000}
      # Config efetiva da execução (gravada por new_execution) ou a base.
      EXPERIMENT_CONFIG_PATH: ${EXECUTION_CONFIG_PATH:-/srv/config/experiment_config.yml}
      DATA_ROOT: /srv/data
    volumes:
      - inventory-data:/data
      - ./config:/srv/config:ro
      - ./datasets:/srv/datasets:ro   # catálogo de SKUs (D-03)
      - ./data:/srv/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  # --- Coleta experimental (D-10): comum a Rules e LLM, nunca lida pelo decisor. ---
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus   # sem volume: zerado a cada reset (down -v)
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
      - node-exporter
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command:
      - --housekeeping_interval=1s        # D-26
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      # Sockets explícitos: mesmo caminho no Docker Desktop (VM) e no Linux.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro

volumes:
  orders-data:
  inventory-data:
