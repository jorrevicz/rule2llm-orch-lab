# Ambiente experimental — mesma infraestrutura para Rules e LLM (RNF-001).
# Imagens e versões são provisórias; o pin reproduzível é feito em M8-T03.
name: rule2llm-orch-lab

services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management (UI e API HTTP)
    volumes:
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  # orders-service — API HTTP. Compartilha orders.db (volume orders-data) com o
  # worker do mesmo serviço; nenhum outro serviço acessa esse volume.
  orders-api:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    command: ["uvicorn", "services.orders.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &orders-env
      BROKER_URL: amqp://tcc:tcc@rabbitmq:5672//
      ORDERS_DB_PATH: /data/orders.db
      EXECUTION_ID: ${EXECUTION_ID:-PILOT_0000}
      EXPERIMENT_CONFIG_PATH: /srv/config/experiment_config.yml
    volumes:
      - orders-data:/data
      - ./config:/srv/config:ro
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # inventory-service — worker de reserva. Banco próprio (volume inventory-data).
  # Nesta fase consome apenas inventory.primary; inventory.fallback entra em M4-T08.
  inventory-worker:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    command:
      - celery
      - --app=services.inventory.app.messaging.celery_app
      - worker
      - --queues=inventory.primary
      - --concurrency=1
      # Sem coordenação entre workers: mingle/gossip/heartbeat usam filas transitórias
      # (bloqueadas no RabbitMQ 4) e não fazem parte do experimento.
      - --without-mingle
      - --without-gossip
      - --without-heartbeat
      - --loglevel=INFO
    environment:
      BROKER_URL: amqp://tcc:tcc@rabbitmq:5672//
      INVENTORY_DB_PATH: /data/inventory.db
      EXPERIMENT_CONFIG_PATH: /srv/config/experiment_config.yml
    volumes:
      - inventory-data:/data
      - ./config:/srv/config:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  orders-data:
  inventory-data:
