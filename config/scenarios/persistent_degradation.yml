# Cenário degradação persistente — D-31 (docs/15 §15.4); amplia a Tabela 12 da metodologia.
# Substitui as seções workload e fault da config base (new_execution --scenario).
# Mesmo arquivo para Rules e LLM. Valores finais de M8-T02 (D-11), medidos no servidor da coleta;
# congelados em freeze-v1. 60 pedidos a 0,25/s; janela do 21º ao 40º envio (80–160 s).

scenario_id: persistent_degradation
description: >-
  Rota primária falha quase sempre durante a janela e o fallback segue saudável: o desvio antecipado evita tentativas perdidas.

workload:
  dataset: datasets/orders_v1.json
  requests: 60
  rate_per_second: 0.25
  seed: 1042                    # seed que gerou o dataset

fault:
  type: intermittent_error
  target: inventory.primary
  start_after_seconds: 80
  duration_seconds: 80
  failure_probability: 0.9
  delay_ms: null
  overload_rate_per_second: null
  seed: 2048
