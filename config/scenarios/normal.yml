# Cenário normal — metodologia §4.4, Tabela 12; roadmap M6.
# Substitui as seções workload e fault da config base (new_execution --scenario).
# Mesmo arquivo para Rules e LLM. Valores finais de M8-T02 (D-11), medidos no servidor da coleta;
# congelados em freeze-v1. 60 pedidos a 0,25/s (um envio a cada 4 s): 20 antes, 20 durante e 20 depois
# da janela de falha dos demais cenários.

scenario_id: normal
description: >-
  Steady state: sem falha induzida; base de comparação.

workload:
  dataset: datasets/orders_v1.json
  requests: 60
  rate_per_second: 0.25
  seed: 1042                    # seed que gerou o dataset

fault:
  type: none
  target: null
  start_after_seconds: null
  duration_seconds: null
  failure_probability: null
  delay_ms: null
  overload_rate_per_second: null
  seed: null
