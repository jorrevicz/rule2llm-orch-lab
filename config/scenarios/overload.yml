# Cenário sobrecarga — metodologia §4.4, Tabela 12; roadmap M6.
# Substitui as seções workload e fault da config base (new_execution --scenario).
# Mesmo arquivo para Rules e LLM. Valores finais de M8-T02 (D-11), medidos no servidor da coleta;
# congelados em freeze-v1. 190 pedidos: 20 a 0,25/s, 150 na rajada de 10 s a 15/s e 20 a 0,25/s.

scenario_id: overload
description: >-
  Rajada acima da capacidade do Inventory (service_time_ms) durante a janela: pressão de fila sem indisponibilidade.

workload:
  dataset: datasets/orders_v1.json
  requests: 190
  rate_per_second: 0.25
  seed: 1042                    # seed que gerou o dataset

fault:
  type: overload
  target: null
  start_after_seconds: 80       # coincide com o 21º envio (20 × 4 s): a rajada ocupa os 10 s inteiros
  duration_seconds: 10
  failure_probability: null
  delay_ms: null
  overload_rate_per_second: 15
  seed: null
