# Cenário recuperação pós-falha — metodologia §4.4, Tabela 12; roadmap M6.
# Substitui as seções workload e fault da config base (new_execution --scenario).
# Mesmo arquivo para Rules e LLM. Valores finais de M8-T02 (D-11), medidos no servidor da coleta;
# congelados em freeze-v1. 60 pedidos a 0,25/s; parada do 21º ao 30º envio (80–120 s, 10 tarefas).

scenario_id: recovery
description: >-
  inventory-service inteiro parado durante a janela (só WAIT/ABORT) e retomado; mede o retorno ao steady state.

workload:
  dataset: datasets/orders_v1.json
  requests: 60
  rate_per_second: 0.25
  seed: 1042                    # seed que gerou o dataset

fault:
  type: recovery
  target: inventory-service
  start_after_seconds: 80
  duration_seconds: 40
  failure_probability: null
  delay_ms: null
  overload_rate_per_second: null
  seed: null
