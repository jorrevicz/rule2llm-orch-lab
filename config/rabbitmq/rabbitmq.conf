# Topologia (exchanges, filas, DLX, usuário) declarada em um único lugar:
# definitions.json é importado no boot. Os serviços NÃO redeclaram filas (no_declare).
load_definitions = /etc/rabbitmq/definitions.json

# Estatísticas das filas atualizadas a cada 1 s (D-26), lidas pelo Prometheus
# (rabbitmq_prometheus, /metrics/per-object). O StateBuilder não usa estas estatísticas.
collect_statistics_interval = 1000
